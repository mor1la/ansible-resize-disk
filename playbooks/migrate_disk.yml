---
- name: Disk migration
  hosts: ubuntu
  become: true

  vars:
    old_mount_point: /data
    new_mount_point: /mnt/new_disk

    filesystem_type: ext4
    mount_options: defaults

    # Services that must stay up so Ansible/SSH/network access is not lost.
    keep_services:
      - ssh.service
      - sshd.service
      - systemd-journald.service
      - systemd-logind.service
      - systemd-udevd.service
      - dbus.service
      - NetworkManager.service
      - systemd-networkd.service
      - networking.service
      - systemd-resolved.service

  roles:
    - disk_prepare
    - stop_services
    - data_copy
    - disk_switch
    - start_services
